<!doctype html>
<html lang="en">
  <head>
    <script>
      // Gracefully ignore benign Vite HMR WebSocket disconnects in AI Studio preview environment
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event?.reason?.message === 'WebSocket closed without opened.' ||
          (typeof event?.reason?.message === 'string' && event.reason.message.includes('WebSocket'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event?.message === 'WebSocket closed without opened.' ||
          (typeof event?.message === 'string' && event.message.includes('WebSocket'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
